<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teams | TaskBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header class="bg-dark text-white py-3">
    <div class="container"><h1 class="h4 mb-0">TaskBridge Teams</h1></div>
</header>
<main class="container py-4">
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <section class="mb-5">
        <h2 class="h5">Create team</h2>
        <form class="row g-3" th:action="@{/teams}" th:object="${team}" method="post">
            <div class="col-md-4"><label class="form-label" for="name">Name</label><input class="form-control" id="name" th:field="*{name}" required maxlength="100"></div>
            <div class="col-md-6"><label class="form-label" for="description">Description</label><input class="form-control" id="description" th:field="*{description}"></div>
            <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Create</button></div>
        </form>
    </section>
    <section>
        <h2 class="h5">Teams</h2>
        <div class="table-responsive">
            <table class="table table-striped align-middle">
                <thead><tr><th>Name</th><th>Description</th><th>Notification recipients</th><th class="text-end">Actions</th></tr></thead>
                <tbody>
                <tr th:each="item : ${teams}">
                    <td><a th:href="@{/teams/{id}/projects(id=${item.id})}" th:text="${item.name}"></a></td>
                    <td th:text="${item.description}"></td>
                    <td>
                        <div class="d-flex flex-wrap gap-2 mb-2">
                            <form class="d-flex gap-1" th:each="member : ${item.memberUserIds}" th:action="@{/teams/{id}/members/remove(id=${item.id})}" method="post">
                                <input type="hidden" name="userId" th:value="${member}">
                                <span class="badge text-bg-secondary" th:text="${member}"></span>
                                <button class="btn btn-sm btn-outline-danger" type="submit" aria-label="Remove member">&times;</button>
                            </form>
                        </div>
                        <form class="d-flex gap-2" th:action="@{/teams/{id}/members(id=${item.id})}" method="post">
                            <input class="form-control form-control-sm" name="userId" required maxlength="100" placeholder="Username">
                            <button class="btn btn-sm btn-outline-primary" type="submit">Assign</button>
                        </form>
                    </td>
                    <td class="text-end"><form th:action="@{/teams/{id}/delete(id=${item.id})}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit">Delete</button></form></td>
                </tr>
                <tr th:if="${#lists.isEmpty(teams)}"><td colspan="4" class="text-muted">No teams yet.</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
