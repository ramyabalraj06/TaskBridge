<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects | TaskBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header class="bg-dark text-white py-3"><div class="container d-flex justify-content-between"><h1 class="h4 mb-0" th:text="${team.name} + ' Projects'"></h1><a class="text-white" th:href="@{/teams}">All teams</a></div></header>
<main class="container py-4">
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <section class="mb-5">
        <h2 class="h5">Create project</h2>
        <form class="row g-3" th:action="@{/teams/{id}/projects(id=${team.id})}" th:object="${project}" method="post">
            <div class="col-md-4"><label class="form-label" for="name">Name</label><input class="form-control" id="name" th:field="*{name}" required maxlength="100"></div>
            <div class="col-md-6"><label class="form-label" for="description">Description</label><input class="form-control" id="description" th:field="*{description}"></div>
            <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Create</button></div>
        </form>
    </section>
    <section>
        <h2 class="h5">Projects</h2>
        <div class="table-responsive"><table class="table table-striped align-middle">
            <thead><tr><th>Name</th><th>Status</th><th>Stories</th><th>Change status</th><th class="text-end">Actions</th></tr></thead>
            <tbody>
            <tr th:each="item : ${projects}">
                <td th:text="${item.name}"></td><td th:text="${item.status}"></td>
                <td><a th:href="@{/projects/{id}/stories(id=${item.id})}">Open board</a></td>
                <td><form class="d-flex gap-2" th:action="@{/projects/{id}/status(id=${item.id})}" method="post"><select class="form-select form-select-sm" name="status"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == item.status}"></option></select><button class="btn btn-sm btn-outline-primary" type="submit">Update</button></form></td>
                <td class="text-end"><form th:action="@{/projects/{id}/delete(id=${item.id})}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit">Delete</button></form></td>
            </tr>
            <tr th:if="${#lists.isEmpty(projects)}"><td colspan="5" class="text-muted">No projects yet.</td></tr>
            </tbody>
        </table></div>
    </section>
</main>
</body>
</html>
