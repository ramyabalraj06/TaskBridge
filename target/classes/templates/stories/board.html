<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Story Board | TaskBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header class="bg-dark text-white py-3"><div class="container d-flex justify-content-between"><h1 class="h4 mb-0" th:text="${project.name} + ' Story Board'"></h1><a class="text-white" th:href="@{/teams/{id}/projects(id=${project.team.id})}">Projects</a></div></header>
<main class="container-fluid px-4 py-4">
    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <section class="mb-5">
        <h2 class="h5">Create story</h2>
        <form class="row g-3" th:action="@{/projects/{id}/stories(id=${project.id})}" th:object="${story}" method="post">
            <div class="col-md-3"><label class="form-label" for="title">Title</label><input class="form-control" id="title" th:field="*{title}" required maxlength="150"></div>
            <div class="col-md-3"><label class="form-label" for="description">Description</label><input class="form-control" id="description" th:field="*{description}"></div>
            <div class="col-md-2"><label class="form-label" for="priority">Priority</label><select class="form-select" id="priority" th:field="*{priority}" required><option value="">Choose</option><option th:each="priority : ${priorities}" th:value="${priority}" th:text="${priority}"></option></select></div>
            <div class="col-md-2"><label class="form-label" for="storyPoints">Story points</label><input class="form-control" id="storyPoints" type="number" min="0" th:field="*{storyPoints}"></div>
            <div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Create</button></div>
        </form>
    </section>
    <section class="row g-4">
        <div class="col-12 col-md-6 col-xl-3" th:each="status : ${statuses}">
            <h2 class="h6 text-uppercase border-bottom pb-2" th:text="${status}"></h2>
            <article class="border bg-white p-3 mb-3" th:each="item : ${storiesByStatus.get(status)}">
                <div class="d-flex justify-content-between gap-2"><h3 class="h6" th:text="${item.title}"></h3><span class="badge text-bg-secondary" th:text="${item.priority}"></span></div>
                <p class="small text-muted" th:text="${item.description}"></p>
                <p class="small" th:if="${item.storyPoints != null}" th:text="${item.storyPoints} + ' points'"></p>
                <form class="d-flex gap-2 mb-2" th:action="@{/stories/{id}/status(id=${item.id})}" method="post"><select class="form-select form-select-sm" name="status"><option th:each="target : ${statuses}" th:value="${target}" th:text="${target}" th:selected="${target == item.status}"></option></select><button class="btn btn-sm btn-outline-primary" type="submit">Move</button></form>
                <form th:action="@{/stories/{id}/delete(id=${item.id})}" method="post"><button class="btn btn-sm btn-outline-danger" type="submit">Delete</button></form>
            </article>
            <p class="small text-muted" th:if="${storiesByStatus.get(status) == null}">No stories.</p>
        </div>
    </section>
</main>
</body>
</html>
